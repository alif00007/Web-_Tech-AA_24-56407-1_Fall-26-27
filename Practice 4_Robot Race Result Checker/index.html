<!doctype html>
<html>
  <head>
    <title>Robot Race Result Checker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h2>Robot Race Result Checker</h2>

      <label>Team Name:</label>
      <input type="text" id="teamName" />

      <label>Robot Category:</label>
      <select id="category">
        <option value="">Select Category</option>
        <option value="Beginner">Beginner</option>
        <option value="Advanced">Advanced</option>
      </select>

      <label>Run 1 Time:</label>
      <input type="number" id="run1" />

      <label>Run 2 Time:</label>
      <input type="number" id="run2" />

      <br /><br />

      <input type="checkbox" id="penalty" />
      Robot received a penalty

      <br /><br />

      <button type="button" onclick="calculateResult()">
        Calculate Result
      </button>

      <button type="button" onclick="clearForm()">Clear Form</button>

      <p id="result"></p>

      <p id="qualifiedCount">Qualified Teams: 0</p>
    </div>

    <script src="script.js"></script>
  </body>
</html>
